name: Build & Release PhoCast

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Android Release APK
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Copy & Verify APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} build-output/PhoCast-v1.0.0.apk \;

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoCast-Android-APK
          path: build-output/PhoCast-v1.0.0.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows Native Client & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Native Binary
        run: |
          cd client-pc/rust
          cargo build --release

      - name: Build OBS Studio Plugin DLL
        run: |
          cd obs-plugin
          cargo build --release

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build All-in-One Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Upload Windows All-in-One Installer
        uses: actions/upload-artifact@v4
        with:
          name: PhoCast-Windows-Installer
          path: dist/PhoCast-Setup-v1.0.0.exe
          if-no-files-found: error

      - name: Upload Windows Portable Binary
        uses: actions/upload-artifact@v4
        with:
          name: PhoCast-Windows-Portable
          path: client-pc/rust/target/release/PhoCast.exe
          if-no-files-found: error

      - name: Upload OBS Studio Plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: PhoCast-OBS-Plugin
          path: obs-plugin/target/release/phocast_obs.dll
          if-no-files-found: error

  publish-release:
    name: Publish Direct GitHub Release v1.0.0
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: PhoCast-Android-APK
          path: release-files

      - name: Download Windows Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: PhoCast-Windows-Installer
          path: release-files

      - name: Download Windows Portable Artifact
        uses: actions/download-artifact@v4
        with:
          name: PhoCast-Windows-Portable
          path: release-files

      - name: Download OBS Studio Plugin Artifact
        uses: actions/download-artifact@v4
        with:
          name: PhoCast-OBS-Plugin
          path: release-files

      - name: List Release Files
        run: ls -lh release-files

      - name: Create or Update GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "PhoCast v1.0.0 - Studio Webcam Bridge"
          body: |
            ## 📸 PhoCast v1.0.0 Official Release

            Transform your Android smartphone into a studio-grade 1080p 60FPS webcam for PC, OBS Studio, and NVIDIA Broadcast with zero latency!

            ### 📥 Direct Downloads (No Extraction Needed):
            * 📱 **Android Phone App:** [**`PhoCast-v1.0.0.apk`**](https://github.com/${{ github.repository }}/releases/download/v1.0.0/PhoCast-v1.0.0.apk) (Direct install on Android phone)
            * 💻 **Windows All-in-One Installer:** [**`PhoCast-Setup-v1.0.0.exe`**](https://github.com/${{ github.repository }}/releases/download/v1.0.0/PhoCast-Setup-v1.0.0.exe) (Bundles Client + OBS Plugin auto-installer + Driver cleaner)
            * 🎥 **OBS Studio Native Plugin:** [**`phocast_obs.dll`**](https://github.com/${{ github.repository }}/releases/download/v1.0.0/phocast_obs.dll) (Place into `C:\Program Files\obs-studio\obs-plugins\64bit\`)
            * 📦 **Windows Standalone Portable Client:** [**`PhoCast.exe`**](https://github.com/${{ github.repository }}/releases/download/v1.0.0/PhoCast.exe) (Standalone executable)

            ---
            ### 🌟 Highlights:
            * **Native OBS Studio Plugin (`phocast_obs.dll`):** Direct stream ingestion into OBS Studio graphics pipeline. Zero intermediate virtual camera drivers, zero crashes, zero green screens.
            * **NVIDIA Broadcast & Discord Ready:** Feed PhoCast directly into OBS Studio, then click **Start Virtual Camera** in OBS to broadcast crystal-clear video to NVIDIA Broadcast, Discord, Zoom, and Teams!
            * **Zero Latency:** Ultra-fast bulk YUV conversion and drop-frame policy over USB (ADB) or Wi-Fi.
            * **Crisp 1080p / 60 FPS:** Full HD resolution selection natively tailored for Google Pixel and modern smartphones.
            * **Keep Cool (Screen Off) Mode:** AMOLED pitch-black screen with GPU rendering paused to keep phone cool during long streams.
          files: |
            release-files/PhoCast-v1.0.0.apk
            release-files/PhoCast-Setup-v1.0.0.exe
            release-files/PhoCast.exe
            release-files/phocast_obs.dll
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
