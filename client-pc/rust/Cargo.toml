[package]
name = "phocast"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "PhoCast"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
virtualcam = "1.0.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security"] }
zune-jpeg = "0.4"

[build-dependencies]
winres = "0.1"
